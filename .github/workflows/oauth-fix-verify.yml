name: OAuth Fix Branch Verification
on:
  push:
    branches:
      - fix/oauth-restart-and-state-isolation-20261009
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Pi sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Full test suite
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: "1"
        run: pnpm test
      - name: Package install smoke
        run: pnpm test:package-install
      - name: Build
        run: pnpm build
