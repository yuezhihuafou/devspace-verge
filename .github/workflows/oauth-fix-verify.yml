name: OAuth Fix Branch Verification
on:
  push:
    branches:
      - fix/oauth-restart-and-state-isolation-20261009
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: OAuth regression tests
        run: pnpm exec tsx --test src/oauth-store.test.ts src/server-oauth.test.ts
      - name: Build
        run: pnpm build
