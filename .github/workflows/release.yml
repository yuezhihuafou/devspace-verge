name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main; got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Validate release version
        id: release
        run: |
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          prerelease='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(beta|rc)\.([1-9][0-9]*)$'
          source_version="$(node -p 'require("./package.json").version')"

          if [[ "$VERSION" != "$source_version" ]]; then
            echo "Requested version $VERSION does not match package.json $source_version." >&2
            exit 1
          fi

          if [[ "$VERSION" =~ $stable ]]; then
            is_prerelease=false
          elif [[ "$VERSION" =~ $prerelease ]]; then
            is_prerelease=true
          else
            echo "Unsupported release version: $VERSION" >&2
            echo "Use X.Y.Z, X.Y.Z-beta.N, or X.Y.Z-rc.N." >&2
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh run list \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion \
            --jq '.[0] | "\(.status):\(.conclusion)"')"
          if [[ "$state" != "completed:success" ]]; then
            echo "The exact release commit must have a successful main CI push run; got ${state:-no run}." >&2
            exit 1
          fi

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test:package-install

      - name: Pack release artifact
        id: pack
        run: |
          mkdir -p .release
          filename="$(npm pack --silent --pack-destination .release | tail -n 1)"
          test -n "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "tarball=.release/$filename" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

          args=(release create "$TAG" "$TARBALL" --title "$TAG" --target "$GITHUB_SHA" --generate-notes)
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
